# sample: 内置虚拟数据
# baostock: 真实 A 股（沪深300，免费无需 token）
# tushare: 真实 A 股（需要 TUSHARE_TOKEN）
source: baostock
use_cache: true

universe: hs300
max_stocks: 50
start_date: "2022-01-01"
end_date: "2024-12-31"
min_list_days: 180

filters:
  exclude_st: true
  exclude_suspend: true
  exclude_limit: true

factors:
  momentum_window: 20
  momentum_skip: 5

evaluate:
  forward_days: [1, 5, 20]
  quantiles: 5

ablation:
  - name: baseline
    use_adj: true
    exclude_limit: true
  - name: no_adj
    use_adj: false
    exclude_limit: true
  - name: no_limit_filter
    use_adj: true
    exclude_limit: false
